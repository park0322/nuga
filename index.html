<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행동 누가기록</title>
  
  <!-- 파비콘 설정 -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #4b5563;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 480px;
      padding: 28px 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, textarea:focus {
      border-color: var(--primary-color);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.5;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .message.success {
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      display: block;
    }

    .message.error {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🌱 학생 행동 누가기록</h1>
      <p>관찰한 학생의 행동을 기록해 주세요.</p>
    </div>

    <form id="recordForm">
      <!-- 학생 선택 -->
      <div class="form-group">
        <label for="studentSelect">학생 선택</label>
        <select id="studentSelect" required>
          <option value="">학생 목록을 불러오는 중입니다...</option>
        </select>
      </div>

      <!-- 기록 입력 -->
      <div class="form-group">
        <label for="recordContent">행동 관찰 기록</label>
        <textarea id="recordContent" placeholder="학생의 긍정적인 변화나 관찰한 행동을 구체적으로 기록해 주세요." required></textarea>
      </div>

      <!-- 저장 버튼 -->
      <button type="submit" id="submitBtn" class="btn-submit">기록 저장하기</button>
    </form>

    <!-- 결과 알림 메시지 -->
    <div id="statusMessage" class="message"></div>
  </div>

    const studentSelect = document.getElementById('studentSelect');
    const recordForm = document.getElementById('recordForm');
    const recordContent = document.getElementById('recordContent');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
